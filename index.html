<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calendario</title>
<style>
:root{
  --bg:#e8f6ef; --panel:#ffffff; --fg:#3a1d2b; --muted:#6f7f76; --line:#cfe6da;
  --accent:#c2457a; --accent-soft:#fbdde9; --today:#e0f4ea; --done:#8aa196; --day:#2f6b52; --day-bg:#d6eee2;
  --all-bg:#f1faf5; --am-bg:#fbfefc; --pm-bg:#eef7f2; --gut:44px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1f141a; --panel:#2a1c24; --fg:#f7e6ee; --muted:#b592a4; --line:#4a2f3d;
    --accent:#f08cb4; --accent-soft:#4a2536; --today:#3d2230; --done:#7d6070; --day:#c9a6f0; --day-bg:#2e2440;
    --all-bg:#3a2330; --am-bg:#261b22; --pm-bg:#2a2032; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.gear{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:16px;border-radius:50%}
.btn:disabled{opacity:.4}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--fg);min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.empty{color:var(--muted);font-size:13px;padding:8px 2px}
.note{font-size:12px;color:var(--muted)}
#status{min-height:1.4em;color:var(--muted);font-size:13px}

/* barra in alto */
#top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
#top .ttl{font-weight:650;font-size:15px}
.spacer{flex:1}

.rcrow [hidden]{display:none!important}
.calcfields{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 100%;min-width:0}
/* home e laboratori */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 18px;text-align:left;display:flex;flex-direction:column;gap:6px}
.card strong{font-size:17px}
.card:hover{border-color:var(--accent)}
.sub{font-size:13px;color:var(--muted);margin:14px 2px 6px;font-weight:600}
.calbtns{display:flex;flex-direction:column;gap:8px;max-width:520px}
.calbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:left;width:100%}
.calbtn:hover{border-color:var(--accent)}
.calrow{display:flex;align-items:center;gap:6px;max-width:560px}
.calrow .calbtn{flex:1;min-width:0}
.cardwrap{display:grid;gap:6px}
.cardtools{display:flex;gap:6px;justify-content:flex-end}
.cardtools .x{width:auto;padding:4px 8px;font-size:14px}
.more{position:relative;display:inline-block}
.more>.x{width:auto;padding:4px 10px;font-size:18px;line-height:1}
.menu{position:absolute;right:0;top:100%;margin-top:4px;display:grid;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.15);z-index:30;overflow:hidden}
.menu[hidden]{display:none}
.menuitem{background:none;border:0;text-align:left;padding:10px 14px;font-size:14px;color:var(--fg)}
.menuitem:hover{background:var(--accent-soft)}
.menuitem.danger{color:var(--accent)}

/* calendario: barra della settimana */
.weekbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px}
#period{font-weight:650;min-width:170px;text-align:center}
.navgrp,.viewgrp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr) 290px;align-items:start}
@media (max-width:900px){.calgrid{grid-template-columns:minmax(0,1fr)}}
.left{display:grid;gap:12px;min-width:0}
.side{display:grid;gap:12px;min-width:0}
.scroll{padding:8px}
#cal.wide{overflow-x:auto}
.panel h2{font-size:14px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}

/* settimana */
.week{display:grid;gap:6px;width:100%;grid-template-columns:repeat(7,minmax(0,1fr));align-items:start}
.dcol{min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;min-height:320px}
.dayhead{padding:6px 8px;display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:12px;color:var(--day);background:var(--day-bg);font-weight:650}
.dayhead .dname{display:flex;flex-direction:column;line-height:1.1}
.dayhead strong{font-size:16px;color:var(--fg)}
.dayhead.is-today{background:var(--today)}
.dtog{background:none;border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:12px;line-height:18px;color:var(--muted)}
.dtog[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.allday{padding:6px;display:flex;flex-direction:column;gap:6px;background:var(--all-bg);min-height:34px;border-bottom:1px solid var(--line)}
.ov{padding:6px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:240px}
.none{color:var(--muted);text-align:center;padding:12px 0;font-size:12px}
.item{display:flex;gap:6px;align-items:flex-start;background:var(--accent-soft);border-radius:6px;padding:5px 6px;font-size:13px;cursor:grab;min-width:0}
.item.cat{background:color-mix(in srgb,var(--c) 25%,var(--panel));border-left:4px solid var(--c)}
.item.done{background:transparent;border:1px dashed var(--line)}
.item.done .ct{text-decoration:line-through;color:var(--done)}
.item.sel,.block.sel{box-shadow:0 0 0 2px var(--accent)}
/* copie delle prenotazioni: blu a righe, riconoscibili a colpo d'occhio */
.bk{background:repeating-linear-gradient(135deg,var(--bk) 0 8px,color-mix(in srgb,var(--bk) 78%,#000) 8px 16px)!important;border:1px dashed color-mix(in srgb,var(--bk) 55%,#000)!important;color:var(--fg)}
.bk .ct,.bk .rng{color:var(--fg)}
@media (prefers-color-scheme: dark){

}
.ibody{flex:1;min-width:0;display:flex;flex-direction:column}
.ibody .ct{white-space:normal;word-break:break-word;line-height:1.25}
.rng{font-size:11px;color:var(--muted);font-weight:600}

/* tabella oraria del giorno aperto */
.tl{position:relative;width:100%;margin:4px 0}
.hl{position:absolute;left:0;width:var(--gut);padding-left:4px;font-size:11px;color:var(--muted);font-weight:600;transform:translateY(-7px)}
.hline{position:absolute;left:var(--gut);right:0;border-top:1px solid var(--line)}
.pl{position:absolute;left:0;right:0;font-size:11px;font-weight:650;color:var(--day);background:var(--day-bg);padding:3px 6px;line-height:16px}
.block{position:absolute;border-radius:6px;padding:4px 6px;background:var(--accent-soft);overflow:hidden;cursor:grab;font-size:12.5px;display:flex;flex-direction:column;gap:2px;border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.block.cat{background:color-mix(in srgb,var(--c) 28%,var(--panel));border-left:4px solid var(--c)}
.block.done{opacity:.6}
.block.done .ct{text-decoration:line-through}
.block .ct{white-space:normal;word-break:break-word;line-height:1.2}
.block .rng{font-size:10.5px}
.dragging{opacity:.4}
.over{background:var(--accent-soft)!important}
body.picking .ov,body.picking .allday,body.picking .tl,body.picking .mcell,body.picking #list{outline:1px dashed var(--accent);outline-offset:-3px}

/* mese */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;min-width:0}
.month>*{background:var(--panel);min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mhead{padding:6px;font-size:12px;color:var(--day);background:var(--day-bg)!important;text-align:center;font-weight:650}
.mcell{min-height:96px;padding:5px;display:flex;flex-direction:column;gap:4px;background:var(--all-bg)}
.mcell.out{opacity:.45}
.mcell.is-today{background:var(--today)!important}
.mnum{font-size:12px;color:var(--muted);font-weight:600}

/* elementi di liste e checklist */
.chip{display:flex;align-items:center;gap:5px;background:var(--accent-soft);border-radius:6px;padding:3px 4px 3px 3px;font-size:12.5px;cursor:grab;user-select:none;min-width:0}
.chip.cat{background:color-mix(in srgb,var(--c) 25%,var(--panel));border-left:4px solid var(--c)}
.chip.done{background:transparent;border:1px dashed var(--line);color:var(--done)}
.chip.done.cat{border-left:4px solid var(--c)}
.chip.done .ct{text-decoration:line-through}
.chip.sel{box-shadow:0 0 0 2px var(--accent)}
.ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck,.x{flex:none;border:0;background:none;padding:0;line-height:1;color:var(--muted);font-size:13px;width:16px;height:16px;display:grid;place-items:center;border-radius:4px}
.ck{border:1px solid var(--muted);border-radius:4px;font-size:10px;color:var(--accent)}
.x:hover,.ck:hover{color:var(--fg)}
.list{padding:0 10px 10px;display:grid;gap:6px;min-height:100px}
.add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:10px}
.add .full{grid-column:1/-1}
.add .btn{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.grp-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:650;margin-top:8px}
.grp-h .gcount{margin-left:auto;font-weight:400;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bkrow{display:grid;gap:6px;padding:8px;border:1px solid var(--line);border-radius:10px;cursor:grab}
.bkrow.done .ct{text-decoration:line-through;color:var(--done)}
.bkrow .line{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bkrow .when{color:var(--muted);font-size:12px}
.bkrow .btn.sm{font-size:12px;padding:3px 8px}
.trash{width:auto;font-size:14px}
.protorow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.protorow .ct{flex:1;min-width:120px}
.rcrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px}
.rcrow input,.rcrow select{flex:1 1 110px;min-width:0;width:auto}
.rcrow [data-rc="name"],.rcrow [data-st-f="text"],.rcrow [data-st-f="cols"]{flex:2 1 200px}

/* modifica attività */
#editor{display:none}
#editor.on{display:block}
.ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:12px}
.ed label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.ed label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:13px}
.ed input,.ed select{width:100%}
.ed input[type=checkbox]{width:auto}
.ed input:disabled{opacity:.4}
.edbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:end;grid-column:1/-1}
.edtitle{font-size:12px;color:var(--muted);padding:10px 12px 0}

/* popup impostazioni */
.modalback{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:12px;z-index:50}
.modalback[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:980px;width:100%;max-height:92vh;overflow:auto}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0;font-size:15px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:12px}
.setbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.setbox h3{margin:0;font-size:13px}
.setbox label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.setbox input[type=text],.setbox input[type=url],.setbox select{width:100%}
.setbox input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.setbox .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.setbox .row select,.setbox .row input[type=text]{flex:1;min-width:120px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.exp .rcrow{flex-direction:column;align-items:stretch;padding:12px;gap:8px}
.exp .rcrow input,.exp .rcrow select{font-size:16px;min-height:44px;width:100%;flex:none}
.exp .rcrow > span.note{min-width:0}
.exp .ed-label{display:block;font-size:12px;color:var(--muted)}
body.hasimg .panel,body.hasimg #top{background:color-mix(in srgb,var(--panel) 88%,transparent)}

/* elementi nascosti restano nascosti, anche con uno stile proprio */
[hidden]{display:none !important}
/* la pagina si adatta allo schermo: niente scorrimento laterale involontario */
html,body{max-width:100%;overflow-x:hidden}
img,video,iframe{max-width:100%;height:auto}
input,select,textarea{max-width:100%}
.wrap>*,.side>*,.calgrid>*,.left>*,.ed>*,.edbtns>*{min-width:0;max-width:100%}
.modal{max-width:calc(100vw - 24px)}

/* telefono */
@media (max-width:700px){
  :root{--gut:34px}
  .btn{padding:10px 14px;font-size:15px;min-height:44px}
  .btn.gear{width:46px;height:46px}
  .x{width:28px;height:28px}
  .menuitem{padding:14px 16px;font-size:15px}
  .item{padding:9px 8px;font-size:14px}
  .hl{font-size:11px}
  .pl{font-size:10px}
  #top .ttl{font-size:16px}
  #period{min-width:0;font-size:15px}
  #top .ttl{flex:1 1 100%}
  #top .spacer{display:none}
  .navgrp,.viewgrp{flex:1 1 100%;justify-content:center}
  .navgrp #period{flex:1}
  body{padding:8px}
  .week{gap:3px}
  .dayhead{padding:4px 2px;flex-direction:column;align-items:center;font-size:10px}
  .dayhead strong{font-size:13px}
  .dtog{padding:0 4px}
  .item{font-size:11px;padding:4px}
  .block{font-size:11px;padding:3px 4px}
  .hl{font-size:9px;padding-left:2px}
  .pl{font-size:9px}
  .ov{min-height:200px}
}

/* --- decorazioni dello stile rosa --- */
html[data-style="rosa"] body{
  background:
    radial-gradient(1100px 560px at 8% -12%, #d4f0e2 0%, transparent 62%),
    radial-gradient(900px 480px at 112% 8%, #fde0ec 0%, transparent 58%),
    var(--bg);
  background-attachment:fixed;
}
@media (prefers-color-scheme: dark){html[data-style="rosa"] body{
    background:
      radial-gradient(1100px 560px at 8% -12%, #33213a 0%, transparent 62%),
      radial-gradient(900px 480px at 112% 8%, #1d2b2c 0%, transparent 58%),
      var(--bg);
    background-attachment:fixed;
  }}
html[data-style="rosa"] ::selection{background:var(--accent-soft)}
html[data-style="rosa"] ::-webkit-scrollbar{width:10px;height:10px}
html[data-style="rosa"] ::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
html[data-style="rosa"] h1, html[data-style="rosa"] h2, html[data-style="rosa"] h3, html[data-style="rosa"] .card h2, html[data-style="rosa"] .mhead h2{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;letter-spacing:.2px}
html[data-style="rosa"] #top{border-radius:16px;box-shadow:0 1px 2px rgba(58,29,43,.06),0 10px 26px -16px rgba(58,29,43,.28)}
html[data-style="rosa"] #top .ttl{
  font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:17px;letter-spacing:.3px;
  background:linear-gradient(90deg,var(--accent),#8e3fd1);-webkit-background-clip:text;background-clip:text;color:transparent;
}
html[data-style="rosa"] .panel{
  border-radius:16px;
  box-shadow:0 1px 2px rgba(58,29,43,.05),0 12px 28px -18px rgba(58,29,43,.30);
}
html[data-style="rosa"] .btn{border-radius:999px;padding:6px 14px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease,background .15s ease}
html[data-style="rosa"] .btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px -8px rgba(194,69,122,.55)}
html[data-style="rosa"] .btn:active{transform:translateY(0)}
html[data-style="rosa"] .btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),#8e3fd1);border-color:transparent}
html[data-style="rosa"] .btn.gear{border-radius:50%}
html[data-style="rosa"] input, html[data-style="rosa"] select{border-radius:10px;transition:box-shadow .15s ease,border-color .15s ease}
html[data-style="rosa"] input:focus, html[data-style="rosa"] select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
html[data-style="rosa"] .protorow{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px;margin:6px 0;
  transition:box-shadow .15s ease,transform .15s ease;
}
html[data-style="rosa"] .protorow:hover{box-shadow:0 8px 18px -12px rgba(194,69,122,.6);transform:translateY(-1px)}
html[data-style="rosa"] [data-cat-toggle]{
  border:0;border-radius:12px;padding:9px 12px;text-align:left;
  background:linear-gradient(90deg,var(--accent-soft),transparent 85%);
}
html[data-style="rosa"] .card{border-radius:18px;box-shadow:0 1px 2px rgba(58,29,43,.05),0 14px 30px -20px rgba(58,29,43,.35);transition:transform .15s ease,box-shadow .15s ease}
html[data-style="rosa"] .card:hover{transform:translateY(-2px);box-shadow:0 18px 34px -20px rgba(194,69,122,.5)}
html[data-style="rosa"] .modalback{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
html[data-style="rosa"] .modal{border-radius:18px;box-shadow:0 30px 60px -22px rgba(0,0,0,.4)}
html[data-style="rosa"] .note{letter-spacing:.1px}
@media (prefers-color-scheme: light){html[data-style="rosa"]{--bg:#fdf5fa; --panel:#ffffff; --fg:#4a2d3d; --muted:#8c7a86; --line:#f1dce8; --accent:#e27ba6; --accent-soft:#fde3ef; --today:#eaf9f1; --day:#5b7f9c; --day-bg:#e4f1fb}
html[data-style="rosa"] body{background:linear-gradient(160deg,#fdf1f7 0%,#eefaf4 48%,#f0eeff 100%) fixed}}
@media (prefers-color-scheme: light){html[data-style="rosa"] .panel{border-color:#f1dce8}
html[data-style="rosa"] #top{border-color:#f1dce8}}
html[data-style="rosa"] body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",sans-serif}
html[data-style="rosa"] h1, html[data-style="rosa"] h2, html[data-style="rosa"] h3, html[data-style="rosa"] .card h2, html[data-style="rosa"] .mhead h2, html[data-style="rosa"] #top .ttl{font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",Georgia,serif}
html[data-style="rosa"] .panel, html[data-style="rosa"] #top, html[data-style="rosa"] .card, html[data-style="rosa"] .modal{border-radius:22px}
html[data-style="rosa"] .btn{border-radius:999px;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,background .2s ease}
html[data-style="rosa"] .btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 18px -8px rgba(226,123,166,.7)}
html[data-style="rosa"] .btn:active{transform:scale(.97)}
html[data-style="rosa"] input, html[data-style="rosa"] select{border-radius:14px}
html[data-style="rosa"] .protorow{border-radius:16px;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease}
html[data-style="rosa"] .protorow:hover{transform:translateY(-2px) rotate(-.3deg);box-shadow:0 10px 20px -12px rgba(226,123,166,.7)}
html[data-style="rosa"] [data-cat-toggle]{border-radius:16px;transition:transform .2s ease}

let vista = 'settimana';
let inizioSett = lunedi(new Date());
let mese = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let modifica = null;
let selezionata = null;    // attività scelta dalla lista con il tocco (telefono)
let seminate = false;

// ---- utilità ----
const $ = id => document.getElementById(id);
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function lunedi(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
function aggiungi(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ora(t){ return t ? t.slice(0,5) : ''; }
function normUrl(s){ const v = (s || '').trim(); if (!v) return null; return /^https?:\/\//i.test(v) ? v : 'https://' + v; }
function linkHTML(e){ return e.link ? `<a class="lk" href="${esc(e.link)}" target="_blank" rel="noopener" title="Apri il link">🔗</a>` : ''; }
function colore(nome){ const c = categorie.find(x => x.nome === nome); return c ? c.colore : '#eeeeee'; }
function stato(msg){ $('stato').textContent = msg; setTimeout(() => { if ($('stato').textContent === msg) $('stato').textContent = ''; }, 4000); }
function eventiDelGiorno(d){ const k = iso(d); return eventi.filter(e => e.giorno === k); }

// ---- database ----
async function carica(){
  const c = await sb.from('categorie').select('*').order('posizione').order('nome');
  if (c.error){ stato('Errore categorie: ' + c.error.message); return; }

  // prima volta: salva le categorie di partenza
  if (c.data.length === 0 && !seminate){
    seminate = true;
    const ins = await sb.from('categorie').insert(CATEGORIE_INIZIALI.map((x, i) => ({...x, posizione: i})));
    if (ins.error){ stato('Errore categorie: ' + ins.error.message); return; }
    return carica();
  }
  categorie = c.data;

  const e = await sb.from('eventi').select('*').order('giorno').order('ora_inizio', {nullsFirst: true});
  if (e.error){ stato('Errore di caricamento: ' + e.error.message); return; }
  eventi = e.data;

  aggiornaSelezioniCategoria();
  if ($('setDlg').open) disegnaImpostazioni();
  disegna();
}

async function salva(){
  const titolo = $('fTitolo').value.trim();
  if (!titolo){ alert('Scrivi il nome dell’attività.'); return; }
  const inizio = $('fInizio').value || null;
  const fine = $('fFine').value || null;
  if (inizio && fine && fine <= inizio){ alert('L’orario di fine deve essere dopo quello di inizio.'); return; }
  const riga = {
    titolo,
    giorno: $('fGiorno').value || null,
    ora_inizio: inizio, ora_fine: fine,
    link: normUrl($('fLink').value),
    categoria: $('fCat').value,
    fatto: $('fFatto').checked
  };
  const res = modifica
    ? await sb.from('eventi').update(riga).eq('id', modifica.id)
    : await sb.from('eventi').insert(riga);
  if (res.error){ alert('Non salvato: ' + res.error.message); return; }
  $('dlg').close();
  carica();
}

async function elimina(){
  if (!modifica || !confirm('Eliminare questa attività?')) return;
  const { error } = await sb.from('eventi').delete().eq('id', modifica.id);
  if (error){ alert('Eliminazione non riuscita: ' + error.message); return; }
  $('dlg').close();
  carica();
}

async function aggiungiAllaLista(){
  const titolo = $('rTitolo').value.trim();
  if (!titolo){ stato('Scrivi il nome dell’attività.'); return; }
  const { error } = await sb.from('eventi').insert({
    titolo,
    categoria: $('rCat').value,
    giorno: null,
    fatto: false
  });
  if (error){ alert('Non salvato: ' + error.message); return; }
  $('rTitolo').value = '';
  carica();
}

// sposta un'attività in un altro giorno (o nella lista se giorno è null)
async function sposta(id, giorno){
  const e = eventi.find(x => x.id === id);
  if (!e || e.giorno === giorno){ selezionata = null; disegna(); return; }
  const { error } = await sb.from('eventi').update({ giorno }).eq('id', id);
  if (error){ stato('Spostamento non riuscito: ' + error.message); return; }
  selezionata = null;
  carica();
}

// ---- impostazioni categorie ----
function disegnaImpostazioni(){
  $('listaCat').innerHTML = categorie.length
    ? categorie.map(c => `
        <div class="catrow" data-cat-id="${c.id}">
          <input type="color" value="${c.colore}" data-act="colore" title="Colore">
          <input class="cn" value="${esc(c.nome)}" maxlength="60" data-act="nome">
          <button type="button" data-act="del" title="Elimina categoria">✕</button>
        </div>`).join('')
    : '<div class="vuoto">Nessuna categoria</div>';
}

function apriImpostazioni(){
  disegnaImpostazioni();
  $('setDlg').showModal();
}

async function modificaCategoria(id, campo, valore){
  const cat = categorie.find(c => c.id === id);
  if (!cat) return;
  if (campo === 'colore'){
    const { error } = await sb.from('categorie').update({ colore: valore }).eq('id', id);
    if (error) alert('Colore non salvato: ' + error.message);
  } else {
    const nuovo = valore.trim();
    if (!nuovo || nuovo === cat.nome) return carica();
    if (categorie.some(c => c.nome === nuovo)){ alert('Esiste già una categoria con questo nome.'); return carica(); }
    const { error } = await sb.from('categorie').update({ nome: nuovo }).eq('id', id);
    if (error){ alert('Nome non salvato: ' + error.message); return carica(); }
    // le attività che usavano il vecchio nome passano al nuovo
    await sb.from('eventi').update({ categoria: nuovo }).eq('categoria', cat.nome);
  }
  carica();
}

async function eliminaCategoria(id){
  const cat = categorie.find(c => c.id === id);
  if (!cat) return;
  const usate = eventi.filter(e => e.categoria === cat.nome).length;
  if (usate > 0){
    alert(`“${cat.nome}” è usata da ${usate} attività. Cambia prima la categoria di quelle attività.`);
    return;
  }
  if (!confirm(`Eliminare la categoria “${cat.nome}”?`)) return;
  const { error } = await sb.from('categorie').delete().eq('id', id);
  if (error) alert('Eliminazione non riuscita: ' + error.message);
  carica();
}

async function creaCategoria(){
  const nome = $('nuovaCatNome').value.trim();
  if (!nome){ stato('Scrivi il nome della categoria.'); return; }
  if (categorie.some(c => c.nome === nome)){ alert('Esiste già una categoria con questo nome.'); return; }
  const { error } = await sb.from('categorie').insert({
    nome, colore: $('nuovaCatCol').value, posizione: categorie.length + 1
  });
  if (error){ alert('Non creata: ' + error.message); return; }
  $('nuovaCatNome').value = '';
  carica();
}

// ---- finestra attività ----
function apriForm(e, giorno){
  modifica = e || null;
  $('dlgTitolo').textContent = e ? 'Modifica attività' : 'Nuova attività';
  $('fTitolo').value = e ? e.titolo : '';
  $('fGiorno').value = e ? (e.giorno || '') : (giorno || '');
  $('fInizio').value = e ? ora(e.ora_inizio) : '';
  $('fFine').value = e ? ora(e.ora_fine) : '';
  $('fCat').value = e && categorie.some(c => c.nome === e.categoria) ? e.categoria : (categorie[0] ? categorie[0].nome : '');
  $('fLink').value = e ? (e.link || '') : '';
  $('fFatto').checked = e ? !!e.fatto : false;
  $('elimina').style.display = e ? '' : 'none';
  $('dlg').showModal();
}

function aggiornaSelezioniCategoria(){
  const opzioni = categorie.map(c => `<option>${esc(c.nome)}</option>`).join('');
  const attuale = $('rCat').value;
  $('fCat').innerHTML = opzioni;
  $('rCat').innerHTML = opzioni;
  if (attuale) $('rCat').value = attuale;
}

// ---- disegno ----
function cardHTML(e){
  const orario = e.ora_inizio
    ? ora(e.ora_inizio) + (e.ora_fine ? '–' + ora(e.ora_fine) : '')
    : 'Tutto il giorno';
  return `<div class="ev ${e.fatto ? 'fatto' : ''} ${selezionata === e.id ? 'sel' : ''}" draggable="true"
      style="background:${colore(e.categoria)}" data-id="${e.id}">
    <span class="ttl">${esc(e.titolo)}<small>${orario}</small></span>${linkHTML(e)}</div>`;
}

function disegnaBozze(){
  const bozze = eventi.filter(e => !e.giorno);
  $('listaBozze').innerHTML = bozze.length
    ? bozze.map(e => `
        <div class="ev ${selezionata === e.id ? 'sel' : ''}" draggable="true"
             style="background:${colore(e.categoria)}" data-id="${e.id}">
          <span class="ttl">${esc(e.titolo)}</span>${linkHTML(e)}
          <button class="mod" data-mod="${e.id}" title="Modifica">✎</button>
        </div>`).join('')
    : '<div class="vuoto">Nessuna attività da programmare</div>';
}

function disegnaSettimana(){
  const fine = aggiungi(inizioSett, 6);
  $('periodo').textContent = `${inizioSett.getDate()} ${MESI[inizioSett.getMonth()]} – ${fine.getDate()} ${MESI[fine.getMonth()]} ${fine.getFullYear()}`;
  const oggi = iso(new Date());
  let html = '<div class="giorni">';
  for (let i = 0; i < 7; i++){
    const d = aggiungi(inizioSett, i);
    const k = iso(d);
    html += `<div class="giorno ${k === oggi ? 'oggi' : ''}" data-drop="${k}">
      <button class="testa" data-nuovo="${k}">${GIORNI[i]} ${d.getDate()}</button>
      <div class="lista">${eventiDelGiorno(d).map(cardHTML).join('')}</div>
    </div>`;
  }
  $('cal').innerHTML = html + '</div>';
}

function disegnaMese(){
  const m = mese.getMonth();
  $('periodo').textContent = MESI[m].charAt(0).toUpperCase() + MESI[m].slice(1) + ' ' + mese.getFullYear();
  const oggi = iso(new Date());
  const partenza = lunedi(mese);
  let html = '<div class="mese">' + GIORNI.map(g => `<div class="intest">${g}</div>`).join('');
  for (let i = 0; i < 42; i++){
    const d = aggiungi(partenza, i);
    const k = iso(d);
    html += `<div class="cella ${d.getMonth() !== m ? 'fuori' : ''} ${k === oggi ? 'oggi' : ''}" data-drop="${k}">
      <span class="num" data-nuovo="${k}">${d.getDate()}</span>
      ${eventiDelGiorno(d).map(cardHTML).join('')}
    </div>`;
  }
  $('cal').innerHTML = html + '</div>';
}

function disegna(){
  $('legenda').innerHTML = categorie.map(c =>
    `<span><i class="pallino" style="background:${c.colore}"></i>${esc(c.nome)}</span>`).join('');
  disegnaBozze();
  if (vista === 'settimana') disegnaSettimana(); else disegnaMese();
}

// ---- navigazione ----
function setVista(v){
  vista = v;
  $('vistaSett').setAttribute('aria-pressed', v === 'settimana');
  $('vistaMese').setAttribute('aria-pressed', v === 'mese');
  disegna();
}

$('prev').onclick = () => {
  if (vista === 'settimana') inizioSett = aggiungi(inizioSett, -7);
  else mese = new Date(mese.getFullYear(), mese.getMonth() - 1, 1);
  disegna();
};
$('next').onclick = () => {
  if (vista === 'settimana') inizioSett = aggiungi(inizioSett, 7);
  else mese = new Date(mese.getFullYear(), mese.getMonth() + 1, 1);
  disegna();
};
$('oggi').onclick = () => {
  const t = new Date();
  inizioSett = lunedi(t);
  mese = new Date(t.getFullYear(), t.getMonth(), 1);
  disegna();
};
$('vistaSett').onclick = () => setVista('settimana');
$('vistaMese').onclick = () => setVista('mese');
$('impost').onclick = apriImpostazioni;

// ---- clic sul calendario ----
$('cal').addEventListener('click', ev => {
  if (ev.target.closest('a')) return;
  const card = ev.target.closest('[data-id]');
  if (card){ apriForm(eventi.find(x => x.id === card.dataset.id)); return; }
  const zona = ev.target.closest('[data-drop]');
  if (selezionata && zona){ sposta(selezionata, zona.dataset.drop); return; }
  const nuovo = ev.target.closest('[data-nuovo]');
  if (nuovo) apriForm(null, nuovo.dataset.nuovo);
});

// ---- lista attività ----
$('listaBozze').addEventListener('click', ev => {
  if (ev.target.closest('a')) return;
  const mod = ev.target.closest('[data-mod]');
  if (mod){ apriForm(eventi.find(x => x.id === mod.dataset.mod)); return; }
  const item = ev.target.closest('[data-id]');
  if (item){
    selezionata = selezionata === item.dataset.id ? null : item.dataset.id;
    disegna();
  }
});

// ---- trascinamento (computer) ----
document.addEventListener('dragstart', ev => {
  const el = ev.target.closest('[data-id][draggable="true"]');
  if (!el) return;
  ev.dataTransfer.setData('text/plain', el.dataset.id);
  ev.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragover', ev => {
  const z = ev.target.closest('[data-drop]');
  if (!z) return;
  ev.preventDefault();
  z.classList.add('drop-over');
});
document.addEventListener('dragleave', ev => {
  const z = ev.target.closest('[data-drop]');
  if (z && !z.contains(ev.relatedTarget)) z.classList.remove('drop-over');
});
document.addEventListener('drop', ev => {
  const z = ev.target.closest('[data-drop]');
  if (!z) return;
  ev.preventDefault();
  document.querySelectorAll('.drop-over').forEach(n => n.classList.remove('drop-over'));
  const id = ev.dataTransfer.getData('text/plain');
  if (!id) return;
  const giorno = z.dataset.drop === 'bozze' ? null : z.dataset.drop;
  sposta(id, giorno);
});
document.addEventListener('dragend', () => {
  document.querySelectorAll('.drop-over').forEach(n => n.classList.remove('drop-over'));
});

// ---- finestre e lista rapida ----
$('salva').onclick = salva;
$('elimina').onclick = elimina;
$('annulla').onclick = () => $('dlg').close();
$('rAdd').onclick = aggiungiAllaLista;
$('rTitolo').addEventListener('keydown', e => { if (e.key === 'Enter') aggiungiAllaLista(); });
$('setChiudi').onclick = () => $('setDlg').close();
$('nuovaCatAdd').onclick = creaCategoria;
$('nuovaCatNome').addEventListener('keydown', e => { if (e.key === 'Enter') creaCategoria(); });

$('listaCat').addEventListener('change', ev => {
  const row = ev.target.closest('[data-cat-id]');
  if (!row) return;
  modificaCategoria(row.dataset.catId, ev.target.dataset.act, ev.target.value);
});
$('listaCat').addEventListener('click', ev => {
  const b = ev.target.closest('[data-act="del"]');
  if (!b) return;
  eliminaCategoria(b.closest('[data-cat-id]').dataset.catId);
});

// ---- avvio e aggiornamenti ----
carica();
sb.channel('calendario')
  .on('postgres_changes', {event: '*', schema: 'public', table: 'eventi'}, carica)
  .on('postgres_changes', {event: '*', schema: 'public', table: 'categorie'}, carica)
  .subscribe();
</script>
</body>
</html>
